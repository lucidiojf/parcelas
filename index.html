<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Compras Parceladas</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #009688;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
        }
        .card {
            background: white;
            padding: 18px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 480px;
            margin-bottom: 16px;
            box-sizing: border-box;
        }
        .header {
            color: #00796b;
            border-bottom: 2px solid #009688;
            margin-bottom: 14px;
            padding-bottom: 8px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        label { display: block; margin: 8px 0 4px; font-size: 13px; color: #555; font-weight: 600; }
        input {
            width: 100%;
            padding: 9px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 15px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #009688;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 14px;
            font-weight: bold;
        }
        button:hover { background-color: #00796b; }
        .btn-sec {
            background-color: #e0f2f1;
            color: #004d40;
            border: 1px solid #009688;
            padding: 6px 10px;
            font-size: 12px;
            width: auto;
            margin-top: 0;
        }
        .btn-mini {
            padding: 4px 8px;
            font-size: 11px;
            width: auto;
            margin-top: 0;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-edit { background: #e0f2f1; color: #00695c; border: 1px solid #009688; }
        .btn-del { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
        .total-info {
            background: #e0f2f1;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #004d40;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }
        .devedor-info {
            background: #fff3e0;
            color: #e65100;
            border: 1px solid #ffe0b2;
        }
        .projeto-box {
            border: 2px solid #009688;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 14px;
            background: #fff;
        }
        .projeto-titulo {
            font-size: 16px;
            font-weight: bold;
            color: #00796b;
            border-bottom: 1px solid #b2dfdb;
            padding-bottom: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .objeto-subcard {
            border-left: 4px solid #009688;
            background: #fafafa;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
        }
        .objeto-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            color: #222;
            font-size: 14px;
            gap: 6px;
        }
        .objeto-acoes {
            display: flex;
            gap: 5px;
            margin-top: 6px;
        }
        .badge-cartao {
            background: #009688;
            color: white;
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 10px;
            white-space: nowrap;
        }
        .objeto-resumo {
            font-size: 12px;
            color: #444;
            margin: 6px 0;
            display: flex;
            justify-content: space-between;
        }
        .parcela-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 8px;
            border-bottom: 1px solid #eee;
            background: #ffffff;
            margin-bottom: 4px;
            border-radius: 4px;
            font-size: 13px;
        }
        .parcela-item input[type="checkbox"] { width: auto; margin-left: 8px; cursor: pointer; transform: scale(1.15); }
        .paga { text-decoration: line-through; color: #777; background: #e8f5e9; }
        .sync-bar { font-size: 11px; color: #004d40; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .toggle-btn { background: none; border: none; color: #00796b; font-size: 12px; padding: 0; margin: 4px 0; width: auto; text-align: left; text-decoration: underline; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; padding: 15px; box-sizing: border-box; overflow-y: auto; }
        .parcela-edit-row { display: grid; grid-template-columns: 50px 1fr 1fr; gap: 6px; align-items: center; margin-bottom: 6px; font-size: 12px; }
        .parcela-edit-row input { padding: 5px; font-size: 13px; }
    </style>
</head>
<body>

<div class="card">
    <div class="sync-bar">
        <span id="statusSync">Pronto</span>
        <button class="btn-sec" onclick="abrirConfig()">⚙ GitHub</button>
    </div>

    <div class="header">
        <span>RESUMO GERAL</span>
        <button class="btn-sec" onclick="abrirModalNovo()">+ Novo Objeto</button>
    </div>

    <div class="total-info devedor-info">
        <span>Saldo Devedor Geral:</span>
        <span id="geralDevedor">R$ 0,00</span>
    </div>
    <div class="total-info">
        <span>Total Já Pago:</span>
        <span id="geralPago">R$ 0,00</span>
    </div>

    <div id="containerProjetos" style="margin-top: 14px;"></div>
</div>

<!-- Modal Adicionar / Editar Objeto -->
<div id="modalObjeto" class="modal">
    <div class="card" style="margin: 15px auto;">
        <div class="header">
            <span id="tituloModalObj">ADICIONAR OBJETO</span>
            <button class="btn-sec" onclick="fecharModal('modalObjeto')">✕</button>
        </div>

        <input type="hidden" id="editProjIdx" value="-1">
        <input type="hidden" id="editObjIdx" value="-1">

        <label>Projeto (Agrupador)</label>
        <input type="text" id="nomeProjeto" placeholder="Ex: Celular Moto Razr + Notebook" list="listaProjetosExistentes">
        <datalist id="listaProjetosExistentes"></datalist>

        <label>Nome objeto</label>
        <input type="text" id="nomeObjeto" placeholder="Ex: Notebook">

        <label>Vlr Total (R$)</label>
        <input type="number" step="0.01" id="vlrTotal" placeholder="0.00" oninput="recalcularPreviewParcelas()">

        <label>Qtde parcelas (Inteiro)</label>
        <input type="number" id="qtdParcelas" placeholder="Ex: 10" oninput="recalcularPreviewParcelas()">

        <label>Cartão de Crédito</label>
        <input type="text" id="cartao" placeholder="Ex: Felipe">

        <label>Data da 1ª Parcela</label>
        <input type="date" id="dataInicio" onchange="recalcularPreviewParcelas()">

        <div id="boxAjusteParcelas" style="margin-top: 12px; border-top: 1px dashed #009688; padding-top: 10px; display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                <strong style="font-size:12px; color:#00796b;">Ajuste fino por parcela (opcional):</strong>
                <button type="button" class="btn-mini btn-edit" onclick="forcarDivisaoIgual()">Dividir igual</button>
            </div>
            <div id="listaEdicaoParcelas"></div>
        </div>

        <button onclick="salvarObjetoModal()">Salvar e Sincronizar</button>
        <button class="btn-sec" style="width:100%; margin-top:8px;" onclick="fecharModal('modalObjeto')">Cancelar</button>
    </div>
</div>

<!-- Modal Configuração GitHub -->
<div id="modalGitHub" class="modal">
    <div class="card" style="margin: 30px auto;">
        <div class="header">CONEXÃO GITHUB (dados.json)</div>
        <label>Usuário GitHub</label>
        <input type="text" id="ghUser" placeholder="lucidiojf">
        <label>Repositório</label>
        <input type="text" id="ghRepo" placeholder="parcelas">
        <label>Token (Personal Access Token)</label>
        <input type="password" id="ghToken" placeholder="ghp_...">
        <button onclick="salvarConfigGitHub()">Salvar Conexão</button>
        <button class="btn-sec" style="width:100%; margin-top:8px;" onclick="fecharModal('modalGitHub')">Fechar</button>
    </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) tg.expand();

let fileSha = null;
let abertos = {};
let parcelasTemp = [];

let projetos = [
    {
        id: "proj_1",
        nome: "Celular Moto Razr + Notebook",
        objetos: [
            {
                id: "obj_1",
                nome: "Celular Moto Razr",
                valorTotal: 7709.36,
                qtd: 8,
                cartao: "Felipe",
                parcelas: gerarListaParcelas(7709.36, 8, "2025-12-10", 8)
            },
            {
                id: "obj_2",
                nome: "Notebook",
                valorTotal: 4500.00,
                qtd: 10,
                cartao: "Felipe",
                parcelas: gerarListaParcelas(4500.00, 10, "2025-12-10", 8)
            }
        ]
    }
];

function gerarListaParcelas(total, qtd, dataInicioStr, pagasIniciais = 0) {
    const valorBase = Math.floor((total / qtd) * 100) / 100;
    const diff = Number((total - (valorBase * qtd)).toFixed(2));
    const [ano, mes, dia] = dataInicioStr.split("-").map(Number);
    const lista = [];
    for (let i = 0; i < qtd; i++) {
        const dt = new Date(ano, (mes - 1) + i, dia);
        const val = (i === 0) ? Number((valorBase + diff).toFixed(2)) : valorBase;
        lista.push({
            numero: i + 1,
            valor: val,
            vencimento: dt.toLocaleDateString("pt-BR"),
            paga: (i + 1) <= pagasIniciais
        });
    }
    return lista;
}

function brParaIso(dataBr) {
    if (!dataBr || !dataBr.includes("/")) return "";
    const [d, m, a] = dataBr.split("/");
    return `${a}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`;
}

function moeda(v) {
    return Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function fecharModal(id) {
    document.getElementById(id).style.display = "none";
}

function abrirConfig() {
    document.getElementById("ghUser").value = localStorage.getItem("gh_user") || "lucidiojf";
    document.getElementById("ghRepo").value = localStorage.getItem("gh_repo") || "parcelas";
    document.getElementById("ghToken").value = localStorage.getItem("gh_token") || "";
    document.getElementById("modalGitHub").style.display = "block";
}

function salvarConfigGitHub() {
    localStorage.setItem("gh_user", document.getElementById("ghUser").value.trim());
    localStorage.setItem("gh_repo", document.getElementById("ghRepo").value.trim());
    localStorage.setItem("gh_token", document.getElementById("ghToken").value.trim());
    fecharModal("modalGitHub");
    carregarGitHub();
}

async function carregarGitHub() {
    const user = localStorage.getItem("gh_user");
    const repo = localStorage.getItem("gh_repo");
    const token = localStorage.getItem("gh_token");

    if (!user || !repo || !token) {
        const cache = localStorage.getItem("memento_parcelas_db");
        if (cache) projetos = JSON.parse(cache);
        document.getElementById("statusSync").innerText = "Modo Local (Configure GitHub)";
        renderizar();
        return;
    }

    document.getElementById("statusSync").innerText = "Sincronizando...";
    try {
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/dados.json?t=${Date.now()}`, {
            headers: { Authorization: `token ${token}` }
        });
        if (res.ok) {
            const json = await res.json();
            fileSha = json.sha;
            projetos = JSON.parse(decodeURIComponent(escape(atob(json.content))));
            localStorage.setItem("memento_parcelas_db", JSON.stringify(projetos));
            document.getElementById("statusSync").innerText = "Sincronizado com GitHub ✓";
        } else {
            document.getElementById("statusSync").innerText = "Criará dados.json ao salvar";
        }
    } catch (e) {
        document.getElementById("statusSync").innerText = "Offline (usando cache)";
    }
    renderizar();
}

async function salvarGitHub() {
    localStorage.setItem("memento_parcelas_db", JSON.stringify(projetos));
    const user = localStorage.getItem("gh_user");
    const repo = localStorage.getItem("gh_repo");
    const token = localStorage.getItem("gh_token");
    if (!user || !repo || !token) return;

    document.getElementById("statusSync").innerText = "Salvando no GitHub...";
    try {
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(projetos, null, 2))));
        const body = { message: "Atualização de parcelas", content };
        if (fileSha) body.sha = fileSha;

        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/dados.json`, {
            method: "PUT",
            headers: { Authorization: `token ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.content?.sha) fileSha = data.content.sha;
        document.getElementById("statusSync").innerText = "Salvo no GitHub ✓";
    } catch (e) {
        document.getElementById("statusSync").innerText = "Erro ao salvar";
    }
}

function abrirModalNovo() {
    document.getElementById("tituloModalObj").innerText = "NOVO OBJETO PARCELADO";
    document.getElementById("editProjIdx").value = "-1";
    document.getElementById("editObjIdx").value = "-1";
    document.getElementById("nomeProjeto").value = projetos[0]?.nome || "";
    document.getElementById("nomeObjeto").value = "";
    document.getElementById("vlrTotal").value = "";
    document.getElementById("qtdParcelas").value = "";
    document.getElementById("cartao").value = "";
    document.getElementById("dataInicio").value = "";
    parcelasTemp = [];
    document.getElementById("boxAjusteParcelas").style.display = "none";
    document.getElementById("modalObjeto").style.display = "block";
}

function abrirModalEditar(pIdx, oIdx) {
    const proj = projetos[pIdx];
    const obj = proj.objetos[oIdx];

    document.getElementById("tituloModalObj").innerText = "EDITAR OBJETO / PARCELAS";
    document.getElementById("editProjIdx").value = pIdx;
    document.getElementById("editObjIdx").value = oIdx;
    document.getElementById("nomeProjeto").value = proj.nome;
    document.getElementById("nomeObjeto").value = obj.nome;
    document.getElementById("vlrTotal").value = obj.valorTotal;
    document.getElementById("qtdParcelas").value = obj.qtd;
    document.getElementById("cartao").value = obj.cartao;
    document.getElementById("dataInicio").value = brParaIso(obj.parcelas[0]?.vencimento);

    parcelasTemp = JSON.parse(JSON.stringify(obj.parcelas));
    renderizarEdicaoParcelas();
    document.getElementById("modalObjeto").style.display = "block";
}

function recalcularPreviewParcelas() {
    const total = parseFloat(document.getElementById("vlrTotal").value);
    const qtd = parseInt(document.getElementById("qtdParcelas").value);
    const inicio = document.getElementById("dataInicio").value;
    if (!total || !qtd || !inicio) return;

    const novas = gerarListaParcelas(total, qtd, inicio, 0);
    // Preserva status 'paga' das parcelas anteriores se existirem
    novas.forEach((p, idx) => {
        if (parcelasTemp[idx]) p.paga = parcelasTemp[idx].paga;
    });
    parcelasTemp = novas;
    renderizarEdicaoParcelas();
}

function forcarDivisaoIgual() {
    recalcularPreviewParcelas();
}

function renderizarEdicaoParcelas() {
    const box = document.getElementById("boxAjusteParcelas");
    const lista = document.getElementById("listaEdicaoParcelas");
    if (!parcelasTemp.length) {
        box.style.display = "none";
        return;
    }
    box.style.display = "block";
    lista.innerHTML = "";

    parcelasTemp.forEach((p, idx) => {
        const row = document.createElement("div");
        row.className = "parcela-edit-row";
        row.innerHTML = `
            <span><b>${p.numero}ª</b></span>
            <input type="text" value="${p.vencimento}" onchange="parcelasTemp[${idx}].vencimento = this.value">
            <input type="number" step="0.01" value="${p.valor}" onchange="atualizarValorParcelaTemp(${idx}, this.value)">
        `;
        lista.appendChild(row);
    });
}

function atualizarValorParcelaTemp(idx, novoVal) {
    parcelasTemp[idx].valor = parseFloat(novoVal) || 0;
    const somaTotal = parcelasTemp.reduce((acc, item) => acc + item.valor, 0);
    document.getElementById("vlrTotal").value = somaTotal.toFixed(2);
}

function salvarObjetoModal() {
    const pIdx = parseInt(document.getElementById("editProjIdx").value);
    const oIdx = parseInt(document.getElementById("editObjIdx").value);

    const nomeProj = document.getElementById("nomeProjeto").value.trim();
    const nomeObj = document.getElementById("nomeObjeto").value.trim();
    const total = parseFloat(document.getElementById("vlrTotal").value);
    const qtd = parseInt(document.getElementById("qtdParcelas").value);
    const cartao = document.getElementById("cartao").value.trim() || "Cartão";
    const inicio = document.getElementById("dataInicio").value;

    if (!nomeProj || !nomeObj || !total || !qtd || !inicio) {
        alert("Preencha todos os campos obrigatórios.");
        return;
    }

    if (parcelasTemp.length !== qtd) {
        recalcularPreviewParcelas();
    }

    const totalReal = Number(parcelasTemp.reduce((s, p) => s + p.valor, 0).toFixed(2));

    const objetoAtualizado = {
        id: (pIdx >= 0 && oIdx >= 0) ? projetos[pIdx].objetos[oIdx].id : "obj_" + Date.now(),
        nome: nomeObj,
        valorTotal: totalReal,
        qtd: qtd,
        cartao: cartao,
        parcelas: parcelasTemp
    };

    if (pIdx >= 0 && oIdx >= 0) {
        // Se mudou o nome do projeto, move o objeto
        if (projetos[pIdx].nome.toLowerCase() !== nomeProj.toLowerCase()) {
            projetos[pIdx].objetos.splice(oIdx, 1);
            if (projetos[pIdx].objetos.length === 0) projetos.splice(pIdx, 1);
            inserirNoProjeto(nomeProj, objetoAtualizado);
        } else {
            projetos[pIdx].objetos[oIdx] = objetoAtualizado;
        }
    } else {
        inserirNoProjeto(nomeProj, objetoAtualizado);
    }

    renderizar();
    salvarGitHub();
    fecharModal("modalObjeto");
}

function inserirNoProjeto(nomeProj, obj) {
    const existente = projetos.find(p => p.nome.toLowerCase() === nomeProj.toLowerCase());
    if (existente) {
        existente.objetos.push(obj);
    } else {
        projetos.push({ id: "proj_" + Date.now(), nome: nomeProj, objetos: [obj] });
    }
}

function excluirObjeto(pIdx, oIdx) {
    const nome = projetos[pIdx].objetos[oIdx].nome;
    if (!confirm(`Deseja excluir "${nome}"?`)) return;
    projetos[pIdx].objetos.splice(oIdx, 1);
    if (projetos[pIdx].objetos.length === 0) {
        projetos.splice(pIdx, 1);
    }
    renderizar();
    salvarGitHub();
}

function alternarParcela(pIdx, oIdx, parcIdx) {
    projetos[pIdx].objetos[oIdx].parcelas[parcIdx].paga = !projetos[pIdx].objetos[oIdx].parcelas[parcIdx].paga;
    renderizar();
    salvarGitHub();
}

function toggleParcelasObj(id) {
    abertos[id] = !(abertos[id] ?? true);
    renderizar();
}

function renderizar() {
    const container = document.getElementById("containerProjetos");
    const datalist = document.getElementById("listaProjetosExistentes");
    container.innerHTML = "";
    datalist.innerHTML = "";

    let somaGeralDevedor = 0;
    let somaGeralPago = 0;

    projetos.forEach((proj, pIdx) => {
        const opt = document.createElement("option");
        opt.value = proj.nome;
        datalist.appendChild(opt);

        let projDevedor = 0;
        let projPago = 0;

        proj.objetos.forEach(o => {
            o.parcelas.forEach(p => {
                if (p.paga) { somaGeralPago += p.valor; projPago += p.valor; }
                else { somaGeralDevedor += p.valor; projDevedor += p.valor; }
            });
        });

        const box = document.createElement("div");
        box.className = "projeto-box";
        box.innerHTML = `
            <div class="projeto-titulo">
                <span>${proj.nome}</span>
                <span style="font-size:12px;">Devedor: ${moeda(projDevedor)}</span>
            </div>
        `;

        proj.objetos.forEach((obj, oIdx) => {
            const pagasCount = obj.parcelas.filter(p => p.paga).length;
            const objDevedor = obj.parcelas.filter(p => !p.paga).reduce((a, b) => a + b.valor, 0);
            const isOpen = abertos[obj.id] ?? (pagasCount < obj.qtd);

            const sub = document.createElement("div");
            sub.className = "objeto-subcard";
            sub.innerHTML = `
                <div class="objeto-topo">
                    <span>${oIdx + 1}. ${obj.nome} (${pagasCount}/${obj.qtd}x)</span>
                    <span class="badge-cartao">${obj.cartao}</span>
                </div>
                <div class="objeto-acoes">
                    <button class="btn-mini btn-edit" onclick="abrirModalEditar(${pIdx}, ${oIdx})">✏ Editar valores/parcelas</button>
                    <button class="btn-mini btn-del" onclick="excluirObjeto(${pIdx}, ${oIdx})">🗑 Excluir</button>
                </div>
                <div class="objeto-resumo">
                    <span>Total: <b>${moeda(obj.valorTotal)}</b></span>
                    <span>Devedor: <b style="color:#e65100;">${moeda(objDevedor)}</b></span>
                </div>
                <button class="toggle-btn" onclick="toggleParcelasObj('${obj.id}')">
                    ${isOpen ? "▲ Recolher checklist" : "▼ Mostrar checklist (" + obj.qtd + " parcelas)"}
                </button>
            `;

            if (isOpen) {
                const listaDiv = document.createElement("div");
                listaDiv.style.marginTop = "6px";
                obj.parcelas.forEach((parc, parcIdx) => {
                    const row = document.createElement("div");
                    row.className = `parcela-item ${parc.paga ? "paga" : ""}`;
                    row.innerHTML = `
                        <span><strong>${parc.numero}ª/${obj.qtd}</strong> (${parc.vencimento}) — ${moeda(parc.valor)}</span>
                        <input type="checkbox" ${parc.paga ? "checked" : ""} onchange="alternarParcela(${pIdx}, ${oIdx}, ${parcIdx})">
                    `;
                    listaDiv.appendChild(row);
                });
                sub.appendChild(listaDiv);
            }

            box.appendChild(sub);
        });

        container.appendChild(box);
    });

    document.getElementById("geralDevedor").innerText = moeda(somaGeralDevedor);
    document.getElementById("geralPago").innerText = moeda(somaGeralPago);
}

carregarGitHub();
</script>
</body>
</html>
